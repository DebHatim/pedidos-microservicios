# Puerto del servidor
server:
  port: 8080

# Nombre de la aplicacion
spring:
  application:
    name: api-gateway
  # Configuracion timeouts para el cliente HTTP del gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 5s

      # Configuracion WebFlux para CORS y rutas
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:5173"
                  - "http://localhost"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          # Configuracion de rutas para los microservicios
          routes:
            # Microservicio Pedidos
            - id: order-service-route
              uri: http://order-service:8081
              predicates:
                - Path=/api/orders/**
              metadata:
                connect-timeout: 1000
                response-timeout: 5000
              filters:
                # Filtro de limitacion con Rate Limiting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@ipKeyResolver}"
                # Filtro de reintentos con Retry
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: true
                # Filtro de Circuit Breaker para manejar fallos en el microservicio
                - name: CircuitBreaker
                  args:
                    name: orderServiceCircuitBreaker
                    fallbackUri: forward:/fallback/orders

            # Microservicio Inventario
            - id: inventory-service-route
              uri: http://inventory-service:8082
              predicates:
                - Path=/api/products/**
              metadata:
                connect-timeout: 1000
                response-timeout: 3000
              filters:
                # Filtro de limitacion con Rate Limiting
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@ipKeyResolver}"
                # Filtro de reintentos con Retry
                - name: Retry
                  args:
                    retries: 3
                    statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT
                    methods: GET
                # Filtro de Circuit Breaker para manejar fallos en el microservicio
                - name: CircuitBreaker
                  args:
                    name: inventoryServiceCircuitBreaker
                    fallbackUri: forward:/fallback/inventory

            # Microservicio Notificaciones
            - id: notification-service-ws-route
              uri: ws://notification-service:8083
              predicates:
                - Path=/ws/**,/ws

# Configuracion metricas y trazas
management:
  endpoints:
    web:
      exposure:
        # Exponemos los endpoints vitales para Prometheus y health checks
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0 # 1.0 = Envía el 100% de las trazas (ideal para desarrollo/demo)

  otlp:
    tracing:
      # URL de Jaeger en la red de Docker Compose usando el puerto HTTP OTLP
      endpoint: http://jaeger:4318/v1/traces
  metrics:
    export:
      otlp:
        enabled: false # Desactivamos métricas por OTLP si usas Prometheus, para evitar conflictos
  opentelemetry:
    exporter:
      otlp:
        enabled: true
# Configuracion de Resilience4j para Circuit Breaker que permite manejar fallos en los microservicios y mejorar la
# resiliencia del sistema
resilience4j:
  circuitbreaker:
    instances:
      orderServiceCircuitBreaker:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      inventoryServiceCircuitBreaker:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true