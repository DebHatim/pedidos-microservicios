# Configuracion del proveedor de dashboards para Grafana
apiVersion: 1

providers:
  # Proveedor encargado de escanear la carpeta interna del contenedor de Grafana para cargar los dashboards
  - name: 'Microservicios'
    orgId: 1
    folder: ''
    type: file
    disableDeletion:
    # Frecuencia en segundos con la que Grafana escanea la carpeta de dashboards para detectar cambios
    # y actualizar los dashboards en caso de que se modifiquen
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Ruta interna donde se montaran los archivos .json desde el volumen de Docker Compose
      path: /var/lib/grafana/dashboards