# Configuring the dashboard provider for Grafana
apiVersion: 1

providers:
  # Provider responsible for scanning the internal folder of the Grafana container to load the dashboards
  - name: 'Microservicios'
    orgId: 1
    folder: ''
    type: file
    disableDeletion:
    # Frequency in seconds that Grafana scans the dashboards folder to detect changes
    # and updates the dashboards if they are modified
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Internal path where the .json files will be mounted from the Docker Compose volume
      path: /var/lib/grafana/dashboards