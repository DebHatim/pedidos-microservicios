server:
  port: 8082

spring:
  application:
    name: inventory-service
  jpa:
    hibernate:
      ddl-auto: update

# Metrics and trace configuration
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, beans, conditions
  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

logging:
  level:
    org.springframework.kafka: INFO
    org.apache.kafka: WARN